# ============================================================
# VirtualHost HTTP - Port 9001
# ============================================================
<VirtualHost *:9001>
    ServerName pmb_app
    DocumentRoot /var/www/html

    <Directory /var/www/html/pmb>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/pmb_error.log
    CustomLog ${APACHE_LOG_DIR}/pmb_access.log combined
</VirtualHost>

# ============================================================
# VirtualHost HTTPS - Port 9002
# ============================================================
<VirtualHost *:9002>
    ServerName pmb_app
    DocumentRoot /var/www/html

    SSLEngine             on
    SSLCertificateFile    /etc/ssl/pmb/server.crt
    SSLCertificateKeyFile /etc/ssl/pmb/server.key

    # Protocoles sécurisés uniquement
    SSLProtocol           all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5

    <Directory /var/www/html/pmb>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/pmb_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/pmb_ssl_access.log combined
</VirtualHost>
