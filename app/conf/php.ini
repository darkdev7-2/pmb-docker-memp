; ============================================================
; Configuration PHP 7.4 optimisée pour PMB
; ============================================================

[PHP]
; --- Limites d'exécution ---
max_execution_time    = 3600
max_input_time        = 3600
memory_limit          = 256M

; --- Upload fichiers ---
upload_max_filesize   = 1G
post_max_size         = 1G

; --- Variables ---
max_input_vars        = 50000

; --- Timezone (Bénin = UTC+1, pas de DST) ---
date.timezone         = Africa/Porto-Novo

; --- Encodage ---
default_charset       = UTF-8

; --- Sécurité ---
expose_php            = Off
display_errors        = Off
log_errors            = On
error_log             = /var/log/apache2/php_error.log

; --- Sessions ---
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure   = 1

; --- Extensions ---
extension=yaz.so
