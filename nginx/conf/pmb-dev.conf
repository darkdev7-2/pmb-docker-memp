# ============================================================
# Nginx DEV — HTTP uniquement, port 8080 → Apache :9001
# Pas de SSL, pas de redirect. Utiliser uniquement en local.
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 1G;

    proxy_read_timeout    3600;
    proxy_connect_timeout 60;
    proxy_send_timeout    3600;

    # Bloquer l'installeur PMB après la première installation
    # (commenter ce bloc lors d'une réinstallation)
    location ~ ^/pmb/tables/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass         http://app:9001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
    }

    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
