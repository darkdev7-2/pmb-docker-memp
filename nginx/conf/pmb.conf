# ============================================================
# Nginx - Reverse Proxy frontal pour PMB
# HTTP → redirect HTTPS
# HTTPS → proxy vers Apache (port 9002, SSL interne)
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Serveur HTTPS principal
server {
    listen 443 ssl;
    server_name _;

    # Certificat (partagé via volume Docker avec le conteneur app)
    ssl_certificate     /etc/ssl/pmb/server.crt;
    ssl_certificate_key /etc/ssl/pmb/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers sécurité
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Taille max upload (aligner avec PHP)
    client_max_body_size 1G;

    # Timeouts (PMB peut être lent sur de gros imports)
    proxy_read_timeout    3600;
    proxy_connect_timeout 60;
    proxy_send_timeout    3600;

    # Vérification TLS vers le backend Apache
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/ssl/pmb/server.crt;
    proxy_ssl_name                app;

    root /var/www/html/pmb;
    index index.php index.html;

    # Bloquer l'installeur PMB (accès uniquement au premier déploiement,
    # puis désactiver en commentant le bloc ci-dessous)
    location ~ ^/pmb/tables/ {
        deny all;
        return 404;
    }

    # Fichiers statiques servis directement par Nginx
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         https://app:9002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy PHP → Apache (HTTPS interne port 9002)
    location / {
        proxy_pass         https://app:9002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Bloquer les fichiers sensibles
    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }
}
